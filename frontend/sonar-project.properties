# SonarQube analysis of the web app (DEC-020). Run from frontend/ by the CI pipeline (see Jenkinsfile, docs/ci.md).
# Host URL and token come from the environment (SONAR_HOST_URL, SONAR_TOKEN); never put a token here.
sonar.projectKey=zayora-frontend
sonar.projectName=ZAYORA frontend
sonar.sourceEncoding=UTF-8

# Production code: everything under src except tests and the test helpers.
sonar.sources=src
sonar.exclusions=**/*.test.ts,**/*.test.tsx,src/test/**
# Tests: analysed as test code, not counted as production code or in coverage.
sonar.tests=src
sonar.test.inclusions=**/*.test.ts,**/*.test.tsx,src/test/**

# Coverage from `npm run test:ci` (Node's test runner, lcov).
sonar.javascript.lcov.reportPaths=coverage/lcov.info
