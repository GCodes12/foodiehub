spring:
  application:
    name: order-service
  messages:
    # Client-facing texts live in messages.properties. Never pick a bundle from the machine's locale.
    basename: messages
    fallback-to-system-locale: false
  jpa:
    open-in-view: false
    hibernate:
      # The schema is owned by Flyway migrations; Hibernate never changes it.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
  jackson:
    # Quantities must be whole numbers: reject 2.5 and "2" instead of silently converting them.
    deserialization:
      accept-float-as-int: false
    mapper:
      allow-coercion-of-scalars: false
  security:
    oauth2:
      resourceserver:
        jwt:
          # Tokens must come from the FoodieHub realm and be issued for this service.
          issuer-uri: ${KEYCLOAK_ISSUER_URI:http://localhost:8080/realms/foodiehub}
          audiences: order-service

server:
  port: ${ORDER_SERVICE_PORT:8082}
  error:
    include-message: never
    include-stacktrace: never

foodiehub:
  restaurant-service:
    # Internal REST call for authoritative prices and availability (DEC-013, Q-29).
    base-url: ${RESTAURANT_SERVICE_URL:http://localhost:8081}
    connect-timeout: 2s
    read-timeout: 3s
