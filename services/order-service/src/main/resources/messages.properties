# Order Service — every message a client can see. Java code refers to these keys only; change wording here.
# Error responses: problem.<CODE>.title / problem.<CODE>.detail (the CODE is also returned as the "code" property).
# Validation messages: order.* keys, used by the annotations in CreateOrderRequest ({min}, {max}, {value} are
# filled in by the validator).

# --- Request shape (400) -------------------------------------------------------------------------------------
problem.VALIDATION_FAILED.title=Invalid order request
problem.VALIDATION_FAILED.detail=The order request is invalid.
problem.MALFORMED_REQUEST.title=Invalid order request
problem.MALFORMED_REQUEST.detail=The request body could not be read. Send valid JSON with whole-number quantities and fulfilmentType PICKUP.
problem.INVALID_IDEMPOTENCY_KEY.title=Invalid Idempotency-Key
problem.INVALID_IDEMPOTENCY_KEY.detail=An Idempotency-Key header of 8-64 characters (letters, digits, '-' or '_') is required; a UUID is recommended.

# --- Business rules (422) ------------------------------------------------------------------------------------
problem.DUPLICATE_ITEM.title=Order cannot be placed
problem.DUPLICATE_ITEM.detail=Each menu item may appear only once; combine the quantities into one line.
problem.ITEM_NOT_IN_MENU.title=Order cannot be placed
problem.ITEM_NOT_IN_MENU.detail=A requested item does not exist in this restaurant's menu.
problem.ITEM_UNAVAILABLE.title=Order cannot be placed
problem.ITEM_UNAVAILABLE.detail=A requested item is currently unavailable.
problem.AMOUNT_TOO_LARGE.title=Order cannot be placed
problem.AMOUNT_TOO_LARGE.detail=The order amount is too large.
problem.EMPTY_ORDER.title=Order cannot be placed
problem.EMPTY_ORDER.detail=An order needs at least one item.
problem.RESTAURANT_NOT_AVAILABLE.title=Order cannot be placed
problem.RESTAURANT_NOT_AVAILABLE.detail=Restaurant not found or not available for ordering.

# --- Conflicts and failures ----------------------------------------------------------------------------------
problem.IDEMPOTENCY_KEY_REUSED.title=Idempotency-Key reused
problem.IDEMPOTENCY_KEY_REUSED.detail=This Idempotency-Key was already used for a different order request.
problem.PRICING_UNAVAILABLE.title=Service unavailable
problem.PRICING_UNAVAILABLE.detail=Prices could not be confirmed right now. No order was created; please retry.
problem.STORAGE_FAILED.title=Order not stored
problem.STORAGE_FAILED.detail=The order could not be stored. No order was created; please retry.

# --- Retrieval (404) — one fixed text, so another customer's order looks exactly like a missing one -------------
problem.ORDER_NOT_FOUND.title=Not Found
problem.ORDER_NOT_FOUND.detail=Order not found.

# --- Roles and owner view (DEC-015) --------------------------------------------------------------------------
problem.FORBIDDEN.title=Forbidden
problem.FORBIDDEN.detail=Your account is not allowed to do this.
problem.OWNER_DATA_UNAVAILABLE.title=Service unavailable
problem.OWNER_DATA_UNAVAILABLE.detail=Your restaurants could not be loaded right now. Please retry.

# --- Order lifecycle (DEC-016) --------------------------------------------------------------------------------
problem.INVALID_TRANSITION.title=Status change not allowed
problem.INVALID_TRANSITION.detail=This order cannot move to that status from its current status.
problem.ORDER_CHANGED.title=Order changed
problem.ORDER_CHANGED.detail=This order was updated in the meantime. Refresh to see its current status.

# --- Platform overview for administrators (DEC-017) ------------------------------------------------------------
problem.INVALID_QUERY.title=Invalid query
problem.INVALID_QUERY.detail=A query parameter is invalid. Check the status and restaurant filters.

# --- Field validation ----------------------------------------------------------------------------------------
order.restaurantId.required=is required
order.id.invalid=must be a valid identifier
order.fulfilmentType.required=is required
order.items.required=must contain at least one item
order.items.tooMany=must contain at most {max} lines
order.items.line.required=must not be empty
order.menuItemId.required=is required
order.quantity.required=is required
order.quantity.min=must be at least {value}
order.quantity.max=must be at most {value}
order.status.required=is required
