# Restaurant Service — every message a client can see. Java code refers to these keys only; change wording here.
# Error responses: problem.<CODE>.title / problem.<CODE>.detail (the CODE is also returned as the "code" property).

# One fixed text for nonexistent AND inactive restaurants, so the response never reveals which (DEC-010, SEC-008).
problem.RESTAURANT_NOT_FOUND.title=Not Found
problem.RESTAURANT_NOT_FOUND.detail=Restaurant not found.

# --- Owner endpoints (DEC-015) -------------------------------------------------------------------------------
problem.FORBIDDEN.title=Forbidden
problem.FORBIDDEN.detail=Your account is not allowed to do this.
# Also used for a dish of a restaurant the caller does not own, so ownership is never revealed.
problem.MENU_ITEM_NOT_FOUND.title=Not Found
problem.MENU_ITEM_NOT_FOUND.detail=Menu item not found.
problem.VALIDATION_FAILED.title=Invalid request
problem.VALIDATION_FAILED.detail=The request is invalid. See the field errors.
problem.MALFORMED_REQUEST.title=Invalid request
problem.MALFORMED_REQUEST.detail=The request body could not be read. Send valid JSON.
problem.NOTHING_TO_UPDATE.title=Invalid request
problem.NOTHING_TO_UPDATE.detail=Send at least one field to change.

# --- Administrator endpoints (DEC-017) -------------------------------------------------------------------------
problem.INVALID_OWNER.title=Owner cannot be assigned
problem.INVALID_OWNER.detail=Choose an enabled account that has the restaurant owner role in Keycloak.
problem.RESTAURANT_HAS_NO_MENU.title=Restaurant cannot be activated
problem.RESTAURANT_HAS_NO_MENU.detail=A restaurant needs at least one available dish before customers can see it.
problem.RESTAURANT_CHANGED.title=Restaurant changed
problem.RESTAURANT_CHANGED.detail=This restaurant was updated in the meantime. Reload it and try again.
problem.USER_DIRECTORY_UNAVAILABLE.title=Service unavailable
problem.USER_DIRECTORY_UNAVAILABLE.detail=Accounts could not be loaded from the sign-in service right now. Please retry.

problem.OWNER_USERNAME_TAKEN.title=Username already in use
problem.OWNER_USERNAME_TAKEN.detail=An account with this username already exists. Choose another username.
problem.OWNER_EMAIL_TAKEN.title=E-mail already in use
problem.OWNER_EMAIL_TAKEN.detail=An account with this e-mail address already exists. Use another address.
problem.OWNER_PROVISIONING_UNAVAILABLE.title=Owner accounts cannot be created
problem.OWNER_PROVISIONING_UNAVAILABLE.detail=The sign-in service could not create the account right now, or owner creation is not set up. No account was created.

# Field validation (administrator requests)
admin.name.required=is required
admin.name.size=must be at most {max} characters
admin.description.size=must be at most {max} characters
admin.address.size=must be at most {max} characters
admin.city.size=must be at most {max} characters
admin.phone.invalid=must be 6-20 digits, spaces or + - ( )
admin.expectedVersion.required=is required
admin.active.required=is required
admin.ownerSub.required=is required
admin.ownerSub.invalid=must be a valid account identifier
admin.fullName.required=is required
admin.fullName.size=must be at most {max} characters
admin.email.required=is required
admin.email.invalid=must be a valid e-mail address
admin.email.size=must be at most {max} characters
admin.username.required=is required
admin.username.invalid=must be 3-50 lower-case letters, digits, dots, hyphens or underscores, starting with a letter or digit
admin.temporaryPassword.required=is required
admin.temporaryPassword.size=must be {min}-{max} characters
admin.temporaryPassword.containsUsername=must not contain the username

# Field validation (UpdateMenuItemRequest)
menu.price.min=must be greater than 0
menu.price.max=must be at most 99999999.99
menu.price.digits=must have at most two decimal places
menu.description.size=must be at most {max} characters
